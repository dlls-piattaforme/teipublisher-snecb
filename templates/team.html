        <style>
            :root{
                --color-theme: #222;

            body{
                margin: 0px;

            .menuCont{
                position:absolute;

                justify-content: center;
                height:50px;
                width:100%;
                text-align: center;
                display: flex;
                z-index:10;
            }

            .menuEl{
                color: var(--color-theme);
                font-size:1.2vw;
                padding-top:10px;
                padding-left:20px;
                padding-right:20px;
                padding-bottom:10px;
                transition:all .3s;
                cursor:pointer;
                text-decoration:none;
            }
            
            .menuEl:hover,
            .menuEl:focus-visible{
                background: var(--color-theme-light);
                color:#fff;
            }

            .mainContainer{
                position: relative;
                z-index: 10;
                left: 50%;
                transform: translateX(-50%);
                width: 48vw;
                top: 10vh;
                padding-bottom: 150px;
            }

            p{
                text-align: justify;
                text-justify: inter-word;
            }

            /* CUSTOM MEDIA QUERIES */

            @media screen and (min-width: 1201px){
                .menuEl{
                    margin-top: 20px;
                }
            }

            /* misure responsive schermi grandi */
            @media screen and (max-width: 1200px){
                .menuEl{
                    font-size:1.6vw;
                }
            }

            /* schermi medi */
            @media screen and (max-width: 900px){
                
                .menuCont{
                    width: 20vw;
                }
                
                .menuEl{
                    font-size:2.3vw;
                    padding-top:10px;
                    padding-left:10px;
                    padding-right:10px;
                    padding-bottom:10px;
                }

                .descContainer{
                    font-size: 3vw;
                }
            }

            /* schermi piccoli (larghezza e altezza sotto) */
            @media screen and (max-width: 450px){
                .menuEl{
                    font-size:3vw;
                    padding-top:10px;
                    padding-left:5px;
                    padding-right:5px;
                    padding-bottom:10px;
                }

                .descContainer{
                    font-size: 4.5vw;
                    padding-bottom: 1vh;
                }

                .mainContainer{
                    width: 70%;
                    padding-left: 15%;
                    padding-right: 15%;
                }
                
                .menuCont{
                    display: none;
                }
                
                .menuContCentral{
                    display: contents;
                    position:absolute;
                    left:0vh;
                    z-index:10;
                    width: 1vw;
                    mix-blend-mode: darken;
                }
                
                .logoimage-central{
                    width: 30vw;
                    height: 35vw;
                    margin-left: 30%;
                }
